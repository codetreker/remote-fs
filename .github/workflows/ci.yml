name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A superseded pull request has nothing to say, but every commit that lands on main
  # gets a result of its own.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # The layers that mount a filesystem, named once. The Linux jobs divide the suite
  # on exactly this line: the mounted job runs these, the checks job runs everything else.
  MOUNTING_PACKAGES: ./packages/fuse/... ./cmd/...

jobs:
  windows:
    name: Windows 11 ARM64 SMB
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare Go directories in the workspace
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $workRoot = Join-Path $env:GITHUB_WORKSPACE '.tmp/windows-ci'
          $paths = @{
            GOCACHE = 'go-build'
            GOMODCACHE = 'go-mod'
            GOPATH = 'go-path'
            TMPDIR = 'tmp'
            TMP = 'tmp'
            TEMP = 'tmp'
          }
          foreach ($name in $paths.Keys) {
            $path = Join-Path $workRoot $paths[$name]
            New-Item -ItemType Directory -Force -Path $path | Out-Null
            $value = $path.Replace('\', '/')
            Add-Content -LiteralPath $env:GITHUB_ENV -Value "$name=$value" -Encoding utf8
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value 'GOTOOLCHAIN=local' -Encoding utf8
      - uses: ./.github/actions/setup-go

      - name: Assert native Windows 11 ARM64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $os = Get-CimInstance Win32_OperatingSystem
          $architecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          [ordered]@{
            Caption = $os.Caption
            Version = $os.Version
            BuildNumber = $os.BuildNumber
            ProductType = $os.ProductType
            Architecture = $architecture
            ImageOS = $env:ImageOS
            ImageVersion = $env:ImageVersion
          } | ConvertTo-Json | Write-Output
          if ($os.ProductType -ne 1 -or ([version]$os.Version).Major -ne 10 -or [int]$os.BuildNumber -lt 26100) {
            throw 'SMB acceptance requires Windows 11 24H2 or later, client edition.'
          }
          if ($architecture -ne 'Arm64') {
            throw 'The Windows 11 runner must use ARM64.'
          }
          $target = go env GOOS GOARCH
          if ($LASTEXITCODE -ne 0 -or ($target -join '/') -ne 'windows/arm64') {
            throw 'Go must compile and execute natively for windows/arm64.'
          }
          go version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Record native SMB mapping capabilities
        id: mapping-baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $mapping = Get-CimClass -Namespace 'ROOT/Microsoft/Windows/SMB' -ClassName 'MSFT_SmbMapping'
          $identity = [System.Security.Principal.WindowsIdentity]::GetCurrent()
          try {
            $principal = [System.Security.Principal.WindowsPrincipal]::new($identity)
            [ordered]@{
              MappingProperties = @($mapping.CimClassProperties | ForEach-Object {
                @{ Name = $_.Name; Type = $_.CimType.ToString() }
              })
              GetMappingParameters = @((Get-Command Get-SmbMapping).Parameters.Keys | Sort-Object)
              NewMappingParameters = @((Get-Command New-SmbMapping).Parameters.Keys | Sort-Object)
              UserSID = $identity.User.Value
              IsAuthenticated = $identity.IsAuthenticated
              AuthenticationType = $identity.AuthenticationType
              ImpersonationLevel = $identity.ImpersonationLevel.ToString()
              IsAdministrator = $principal.IsInRole([System.Security.Principal.WindowsBuiltInRole]::Administrator)
            } | ConvertTo-Json -Depth 5 | Write-Output
          } finally {
            $identity.Dispose()
          }
          $mappingKeys = @(Get-SmbMapping | ForEach-Object { "$($_.LocalPath)|$($_.RemotePath)" })
          $baseline = Join-Path $env:GITHUB_WORKSPACE '.tmp/windows-ci/smb-mappings-before.json'
          ConvertTo-Json -InputObject $mappingKeys | Set-Content -LiteralPath $baseline -Encoding utf8

      - name: Portable storage and SMB tests
        shell: bash
        run: |
          .github/scripts/assert-every-test-ran.sh -count=1 -p=1 -timeout 5m \
            ./packages/storage ./packages/smb ./packages/smb/internal/...

      - name: Native SSPI and SMB mapping tests
        shell: bash
        run: |
          .github/scripts/assert-every-test-ran.sh -count=1 -p=1 -timeout 10m \
            ./packages/smb/windows

      - name: Install the coverage gate
        shell: bash
        run: go install github.com/codetreker/go-cov/cmd/go-cov@v0.1.4-0.20260617124522-d6caf2759e33

      - name: Windows helper subtree coverage
        shell: bash
        working-directory: packages/smb/windows
        run: |
          set -euo pipefail
          export GOFLAGS="-count=1"
          go-cov --ci --race=false --config ../../../.go-cov.toml \
            --module-prefix github.com/codetreker/remote-fs/packages/smb/windows

      - name: No SMB mapping left behind
        if: ${{ !cancelled() && steps.mapping-baseline.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $baseline = Join-Path $env:GITHUB_WORKSPACE '.tmp/windows-ci/smb-mappings-before.json'
          $before = @(Get-Content -LiteralPath $baseline -Raw | ConvertFrom-Json)
          $after = @(Get-SmbMapping | ForEach-Object { "$($_.LocalPath)|$($_.RemotePath)" })
          $remaining = @($after | Where-Object { $_ -notin $before })
          if ($remaining.Count -ne 0) {
            throw "SMB mappings outlived the tests: $($remaining -join ', ')"
          }

  checks:
    name: build, format, links, contract and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go

      - run: go build ./...
      - run: go vet ./...

      - name: gofmt
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would rewrite these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Relative links in Markdown resolve
        run: |
          set -uo pipefail
          # grep finds nothing in a file whose links are all absolute, and that is not a
          # failure, so the assignment must not inherit its status.
          broken="$(while IFS= read -r f; do
            d=$(dirname "$f")
            grep -oP '\]\(\K[^)#]+(?=[)#])' "$f" | grep -v '^https\?://' |
              while read -r l; do [ -e "$d/$l" ] || echo "$f -> $l"; done
          done < <(find . -name '*.md' -not -path './.git/*'))" || true
          if [ -n "$broken" ]; then
            echo "::error::these relative links point at nothing:"
            echo "$broken"
            exit 1
          fi

      - name: Replication visibility acceptance
        run: |
          .github/scripts/assert-every-test-ran.sh -tags rfs_acceptance -count=1 \
            -p=1 -parallel=1 -timeout 3m ./packages/storage/replicated

      # packages/storage/objectstore/azblob is tested against a real Blob endpoint, and
      # this suite fails on a skipped test rather than tolerating a missing dependency, so
      # the emulator is a precondition brought up here. `--wait` returns only once the
      # service answers a request, so the step below cannot start ahead of it.
      - name: Start the Azure Blob emulator
        run: docker compose -f deployments/ci/docker-compose.yml up -d --wait --wait-timeout 120

      - name: Contract and unit tests
        run: |
          set -euo pipefail
          # Both expansions are lists of import paths and must split into arguments.
          # shellcheck disable=SC2046,SC2086
          go list $MOUNTING_PACKAGES >"$RUNNER_TEMP/mounting"
          # shellcheck disable=SC2046
          .github/scripts/assert-every-test-ran.sh -race -count=1 -timeout 10m \
            $(go list ./... | grep -vxF -f "$RUNNER_TEMP/mounting")

  mounted:
    name: differential and end-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go

      # This job's whole purpose is to mount filesystems. If the runner cannot, that is
      # a result to report, not a condition to work around, so every precondition is
      # asserted here where the diagnosis is one line rather than inferred later from a
      # wall of test failures.
      - name: Assert this runner can mount a filesystem
        run: |
          set -uo pipefail
          fail() { echo "::error::$*"; exit 1; }
          uname -a
          # fuse3 reaches the image as a dependency of other packages rather than as a
          # documented part of it, so it can leave without notice.
          command -v fusermount3 >/dev/null ||
            { sudo apt-get update && sudo apt-get install -y fuse3; }
          helper="$(command -v fusermount3)" ||
            fail "no fusermount3 on this runner, and installing fuse3 did not provide one"
          ls -l /dev/fuse "$helper"
          test -c /dev/fuse ||
            fail "/dev/fuse is not a character device on this runner; the layers this job exists to run cannot run here"
          # actions/runner-images#14516 shipped a non-setuid, world-writable
          # fusermount3 earlier on PATH than the distro's, and every unprivileged mount
          # failed for a week. These are the properties that made the real one work.
          if ! { test -u "$helper" && [ "$(stat -Lc %u "$helper")" = 0 ] && [ ! -w "$helper" ]; }; then
            fail "$helper is not a setuid-root helper, so unprivileged mounting will fail (actions/runner-images#14516)"
          fi
          # This distro's libfuse counts existing mounts by reading /proc, which is not
          # atomic and can see one mount thousands of times; the differential layer
          # mounts once per case. Fixed upstream in libfuse 3.18.0, which 24.04 predates.
          echo 'mount_max = 10000' | sudo tee -a /etc/fuse.conf
          ls /sys/fs/fuse/connections >"$RUNNER_TEMP/fuse-connections-before" 2>/dev/null || true

      # The binary lock and restart tests exercise Azure Blob. Coverage later reuses
      # this ready emulator when it runs the whole module.
      - name: Start the Azure Blob emulator
        run: docker compose -f deployments/ci/docker-compose.yml up -d --wait --wait-timeout 120

      - name: Differential and end-to-end tests
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          .github/scripts/assert-every-test-ran.sh -race -count=1 -timeout 10m $MOUNTING_PACKAGES

      - name: Install the coverage gate
        run: go install github.com/codetreker/go-cov/cmd/go-cov@v0.1.4-0.20260617124522-d6caf2759e33

      - name: Coverage gate
        run: |
          set -euo pipefail
          # Measure each package only while running its own tests. Force execution
          # because the test cache does not track whether /dev/fuse is available.
          export GOFLAGS="-count=1"
          go-cov --ci --skip-result-packages cmd,packages/metastore/sqlite/internal/integration

      # A mount that outlived the test that made it means a t.Cleanup did not do what
      # the test reported it did. This runner is thrown away, so nothing later is at
      # risk — the reason to fail is that the run already claimed success about a
      # teardown that did not happen.
      - name: No mount left behind
        if: ${{ !cancelled() }}
        run: |
          set -uo pipefail
          leaked=0
          report() { echo "::error::$1"; echo "$2"; leaked=1; }

          # Each of these three finds nothing on a clean run and says so by exiting
          # non-zero, which is the answer we want rather than a step failure.
          mounts="$(awk '$3 == "fuse.remote-fs" { print $2 }' /proc/self/mounts)" || true
          [ -z "$mounts" ] || report "these mountpoints outlived the tests that made them:" "$mounts"

          if [ -d /sys/fs/fuse/connections ] && [ -f "$RUNNER_TEMP/fuse-connections-before" ]; then
            ls /sys/fs/fuse/connections >"$RUNNER_TEMP/fuse-connections-after"
            connections="$(grep -vxF -f "$RUNNER_TEMP/fuse-connections-before" \
              "$RUNNER_TEMP/fuse-connections-after")" || true
            [ -z "$connections" ] ||
              report "these FUSE connections are still open:" "$connections"
          fi

          survivors="$(pgrep -a fusermount)" || true
          [ -z "$survivors" ] || report "fusermount processes survived the run:" "$survivors"

          exit "$leaked"
