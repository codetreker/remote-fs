name: Inbox SMB and NTFS native behavior reference

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - .github/workflows/native-smb-inbox-reference.yml
      - .github/scripts/native-smb-inbox-reference*

permissions:
  contents: read

concurrency:
  group: native-smb-inbox-reference-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  inbox-reference:
    name: One direct 445 native behavior reference
    runs-on: windows-11-arm
    timeout-minutes: 15
    env:
      RFS_INBOX_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Read the immutable helper source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 1cb9ad7f49d998de4daa4d562d766b18cf06ce16
          path: .tmp/native-inbox-reference/prototype
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          cache: false
      - name: Record existing prerequisites and ownership intent
        id: preflight
        shell: pwsh
        run: ./.github/scripts/native-smb-inbox-reference.ps1 -Phase Prepare
      - name: Generate and build the independent reference fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go run .github/scripts/native-smb-inbox-reference-generate.go -root . -prototype .tmp/native-inbox-reference/prototype -output .tmp/native-inbox-reference/fixture
          if ($LASTEXITCODE -ne 0) { throw 'Reference source generation failed.' }
          go -C .tmp/native-inbox-reference/fixture test -json -count=1 -p=1 -timeout=3m -run '^TestInboxReference' 2>&1 | Tee-Object .tmp/native-inbox-reference/results/controls.jsonl
          $code = $LASTEXITCODE
          $events = @(Get-Content .tmp/native-inbox-reference/results/controls.jsonl | Where-Object { $_.StartsWith('{') } | ForEach-Object { $_ | ConvertFrom-Json })
          if ($code -ne 0 -or @($events | Where-Object { $_.Action -in @('fail','skip','build-fail') }).Count) { throw 'Reference controls failed.' }
          foreach ($name in @('TestInboxReferenceIPC','TestInboxReferenceOwnership','TestInboxReferenceRenamePayload','TestInboxReferenceOracle','TestInboxReferenceWatchOwnership')) {
            if (@($events | Where-Object { $_.Test -eq $name -and $_.Action -eq 'pass' }).Count -ne 1) { throw "Missing control verdict: $name" }
          }
          go -C .tmp/native-inbox-reference/fixture test -c -o ../results/native-inbox-reference.test.exe
          if ($LASTEXITCODE -ne 0) { throw 'Reference ARM64 executable build failed.' }
          Copy-Item .tmp/native-inbox-reference/fixture/reuse-manifest.json .tmp/native-inbox-reference/results/reuse-manifest.json
      - name: Run the single current-logon reference
        shell: pwsh
        run: ./.github/scripts/native-smb-inbox-reference.ps1 -Phase Run
      - name: Audit exact owned-resource cleanup
        if: always()
        timeout-minutes: 2
        shell: pwsh
        run: ./.github/scripts/native-smb-inbox-reference.ps1 -Phase Verify
      - name: Preserve first native observations and controller evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-smb-inbox-reference-${{ github.run_attempt }}
          path: .tmp/native-inbox-reference/results
          if-no-files-found: error
          retention-days: 14
