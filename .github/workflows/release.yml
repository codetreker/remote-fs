name: Release service

on:
  workflow_dispatch:

concurrency:
  group: service-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/codetreker/remote-fs@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          file: deployments/service/Dockerfile
          push: true
          provenance: false
          tags: ghcr.io/codetreker/remote-fs:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

  staging:
    needs: build
    runs-on: ubuntu-24.04
    environment: staging
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy staging
        env:
          OC_VM_HOST: ${{ vars.OC_VM_HOST }}
          OC_VM_USER: ${{ vars.OC_VM_USER }}
          OC_VM_SSH_KEY: ${{ secrets.OC_VM_SSH_KEY }}
          OC_VM_KNOWN_HOSTS: ${{ vars.OC_VM_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          ENVIRONMENT: staging
          IMAGE: ${{ needs.build.outputs.image }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/deploy-service.sh

  prod:
    needs: [build, staging]
    runs-on: ubuntu-24.04
    environment: prod
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Deploy production
        env:
          OC_VM_HOST: ${{ vars.OC_VM_HOST }}
          OC_VM_USER: ${{ vars.OC_VM_USER }}
          OC_VM_SSH_KEY: ${{ secrets.OC_VM_SSH_KEY }}
          OC_VM_KNOWN_HOSTS: ${{ vars.OC_VM_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          ENVIRONMENT: prod
          IMAGE: ${{ needs.build.outputs.image }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/deploy-service.sh
