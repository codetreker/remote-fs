name: Prepare Go
description: Select the toolchain and restore each job's Go cache snapshot.

inputs:
  cache-job:
    description: Job identity for cache snapshots; defaults to the caller job.
    required: false
  restore-job:
    description: Additional job cache prefix used before the legacy cache.
    required: false

runs:
  using: composite
  steps:
    - id: go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26.8'
        cache: false

    - id: cache
      shell: bash
      env:
        RFS_GO_VERSION: ${{ steps.go.outputs.go-version }}
        RFS_DEPENDENCY_HASH: ${{ hashFiles('go.sum') }}
        RFS_CACHE_JOB: ${{ inputs.cache-job || github.job }}
        RFS_RESTORE_JOB: ${{ inputs.restore-job }}
      run: |
        set -euo pipefail
        test -n "$RFS_DEPENDENCY_HASH"
        platform="${RUNNER_OS}-${RUNNER_ARCH,,}-${ImageOS}"
        prefix="rfs-go-v1-${platform}-go-${RFS_GO_VERSION}-${RFS_CACHE_JOB}-${RFS_DEPENDENCY_HASH}"
        {
          # The path strings and their order retain the existing archive version.
          # https://github.com/actions/setup-go/blob/b7ad1dad31e06c5925ef5d2fc7ad053ef454303e/src/package-managers.ts#L10-L14
          echo 'paths<<GO_CACHE_PATHS'
          go env GOMODCACHE GOCACHE
          echo 'GO_CACHE_PATHS'
          echo "key=${prefix}-${GITHUB_SHA}"
          echo 'restore-keys<<GO_CACHE_RESTORE_KEYS'
          echo "${prefix}-"
          if [ -n "$RFS_RESTORE_JOB" ]; then
            echo "rfs-go-v1-${platform}-go-${RFS_GO_VERSION}-${RFS_RESTORE_JOB}-${RFS_DEPENDENCY_HASH}-"
          fi
          echo "setup-go-${platform}-go-${RFS_GO_VERSION}-${RFS_DEPENDENCY_HASH}"
          echo 'GO_CACHE_RESTORE_KEYS'
        } >> "$GITHUB_OUTPUT"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.cache.outputs.paths }}
        key: ${{ steps.cache.outputs.key }}
        restore-keys: ${{ steps.cache.outputs.restore-keys }}
